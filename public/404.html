<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting... | Emirates Secretarial Services (ESS)</title>
    <script>
      // Single Page Application (SPA) 404 Fallback Redirector
      // Preserves deep link paths and query parameters across hosting providers
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Prevent infinite loops if 404.html is requested directly
        if (path === '/404' || path === '/404.html') {
          window.location.replace('/');
          return;
        }

        // Store path in session and redirect to root SPA
        try {
          sessionStorage.setItem('ess_redirect_path', path + search + hash);
        } catch (e) {}

        // Immediate reload to root with query param fallback
        var redirectUrl = '/?p=' + encodeURIComponent(path + search + hash);
        window.location.replace(redirectUrl);
      })();
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #064E3B;
        color: white;
        text-align: center;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255,255,255,0.2);
        border-top-color: #D97706;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="spinner"></div>
      <h2 style="font-size: 20px; margin-bottom: 8px;">Loading Emirates Secretarial Services...</h2>
      <p style="opacity: 0.8; font-size: 14px;">Redirecting you to your requested page...</p>
      <a href="/" style="color: #FCD34D; font-size: 14px; text-decoration: underline;">Click here if not redirected automatically</a>
    </div>
  </body>
</html>
